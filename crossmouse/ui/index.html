<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CrossMouse</title>
<style>
  :root { color-scheme: dark; --bg:#0f141b; --panel:#171f29; --line:#263242; --text:#e6edf3; --muted:#8b9bad; --accent:#4dd4ac; --warn:#f0a35e; --bad:#f2686f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:18px 26px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:17px; margin:0; letter-spacing:.3px; }
  .logo { width:22px; height:22px; border:2px solid var(--accent); border-radius:6px; position:relative; }
  .logo::after { content:""; position:absolute; width:6px; height:6px; border-radius:50%; background:var(--accent); top:6px; left:6px; }
  main { max-width:960px; margin:0 auto; padding:24px; display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .card.wide { grid-column:1 / -1; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted); margin:0 0 14px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .k { color:var(--muted); }
  .v { font-variant-numeric:tabular-nums; }
  .pill { display:inline-flex; align-items:center; gap:7px; padding:4px 10px; border-radius:99px; font-size:12px; font-weight:600; }
  .pill::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
  .on { color:var(--accent); background:rgba(77,212,172,.12); }
  .off { color:var(--bad); background:rgba(242,104,111,.12); }
  .idle { color:var(--warn); background:rgba(240,163,94,.12); }
  label { display:block; color:var(--muted); font-size:12px; margin:10px 0 4px; }
  input, select { width:100%; background:#0d131a; border:1px solid var(--line); color:var(--text); border-radius:7px; padding:9px 10px; font:inherit; }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  .checks { display:flex; align-items:center; gap:9px; margin-top:14px; }
  .checks input { width:auto; }
  .btns { display:flex; gap:9px; margin-top:18px; flex-wrap:wrap; }
  button { border:1px solid var(--line); background:#1d2834; color:var(--text); border-radius:7px; padding:9px 14px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#08130f; border-color:var(--accent); font-weight:700; }
  #log { height:210px; overflow:auto; background:#0b1016; border:1px solid var(--line); border-radius:7px; padding:10px 12px; font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; }
  #log .t { color:var(--muted); }
  .hint { color:var(--muted); font-size:12px; margin-top:8px; }
  @media (max-width:700px) { main { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header><div class="logo"></div><h1>CrossMouse</h1></header>
<main>
  <section class="card">
    <h2>Connection</h2>
    <div class="row"><span class="k">Link</span><span class="v"><span id="link" class="pill off">Offline</span></span></div>
    <div class="row"><span class="k">Role</span><span class="v" id="role">—</span></div>
    <div class="row"><span class="k">Peer</span><span class="v" id="peer">—</span></div>
    <div class="row"><span class="k">Control</span><span class="v"><span id="mode" class="pill idle">Local</span></span></div>
    <div class="row"><span class="k">Screens</span><span class="v" id="screens">—</span></div>
  </section>

  <section class="card">
    <h2>Configuration</h2>
    <label for="peer_ip">Peer IP (leave empty to listen)</label>
    <input id="peer_ip" placeholder="192.168.1.42" />
    <label for="port">Port</label>
    <input id="port" type="number" min="1" max="65535" />
    <label for="edge">Edge facing peer</label>
    <select id="edge"><option>right</option><option>left</option><option>top</option><option>bottom</option></select>
    <label for="secret">Shared secret</label>
    <input id="secret" type="password" />
    <div class="checks"><input id="clipboard" type="checkbox" /><label for="clipboard" style="margin:0">Sync clipboard (plain text)</label></div>
    <div class="checks"><input id="primary" type="checkbox" /><label for="primary" style="margin:0">Physical mouse is plugged into this machine (only this peer can hand off)</label></div>
    <div class="btns">
      <button class="primary" id="save">Save &amp; reconnect</button>
      <button id="connect">Reconnect</button>
      <button id="handoff">Hand off</button>
    </div>
    <div class="hint" id="cfgmsg"></div>
  </section>

  <section class="card wide">
    <h2>Event log</h2>
    <div id="log"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let lastLog = [];

async function refresh() {
  try {
    const [s, l] = await Promise.all([
      fetch('/api/status').then(r => r.json()),
      fetch('/api/log').then(r => r.json())
    ]);
    const link = $('link');
    link.textContent = s.connected ? 'Connected' : 'Offline';
    link.className = 'pill ' + (s.connected ? 'on' : 'off');
    $('role').textContent = s.connected ? s.role : '—';
    $('peer').textContent = s.peer_ip || 'waiting for peer';
    const mode = $('mode');
    mode.textContent = s.mode === 'controlling' ? 'Controlling peer' : s.mode === 'controlled' ? 'Controlled' : 'Local';
    mode.className = 'pill ' + (s.mode === 'idle' ? 'idle' : 'on');
    $('screens').textContent = `${s.local_screen.join('×')}` + (s.peer_screen.some(Boolean) ? ` → ${s.peer_screen.join('×')}` : '');
    if (JSON.stringify(l.lines) !== JSON.stringify(lastLog)) {
      lastLog = l.lines;
      $('log').innerHTML = l.lines.map(x => `<div><span class="t">${x.slice(0,8)}</span>${x.slice(8)}</div>`).join('');
      $('log').scrollTop = $('log').scrollHeight;
    }
  } catch (e) {}
}

async function loadConfig() {
  const c = await fetch('/api/config').then(r => r.json());
  ['peer_ip','port','edge','secret'].forEach(k => $(k).value = c[k] ?? '');
  $('clipboard').checked = !!c.clipboard;
  $('primary').checked = c.primary !== false;
}

async function action(name, body) {
  await fetch('/api/action', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:name, ...(body||{})})});
  refresh();
}

$('save').onclick = async () => {
  const cfg = {
    peer_ip: $('peer_ip').value.trim() || null,
    port: Number($('port').value),
    edge: $('edge').value,
    secret: $('secret').value,
    clipboard: $('clipboard').checked,
    primary: $('primary').checked
  };
  const r = await fetch('/api/config', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(cfg)});
  const j = await r.json();
  $('cfgmsg').textContent = j.ok ? 'Saved. Reconnecting…' : 'Save failed';
  refresh();
};
$('connect').onclick = () => action('connect');
$('handoff').onclick = () => action('handoff');

loadConfig();
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
